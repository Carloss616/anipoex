mutation SaveMangaTracking(
  $id: Int
  $mediaId: Int
  $status: MediaListStatus
  $progress: Int
  $score: Float
  $startedAt: FuzzyDateInput
  $completedAt: FuzzyDateInput
  $customLists: [String]
) {
  SaveMediaListEntry(
    id: $id
    mediaId: $mediaId
    status: $status
    progress: $progress
    score: $score
    startedAt: $startedAt
    completedAt: $completedAt
    customLists: $customLists
  ) {
    id
    ...MangaTracking
    media {
      id
      ...MangaMedia
    }
  }
}

mutation DeleteMangaTracking($id: Int!) {
  DeleteMediaListEntry(id: $id) {
    deleted
  }
}
