query MangaList($userId: Int!, $status: MediaListStatus!) {
  MediaListCollection(
    userId: $userId
    type: MANGA
    status: $status
    forceSingleCompletedList: true
  ) {
    lists {
      entries {
        id
        media {
          id
          ...MangaMedia @nonreactive
        }
      }
    }
  }
}
