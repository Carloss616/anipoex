fragment MangaTracking on MediaList {
  status
  progress
  score
  startedAt {
    year
    month
    day
  }
  completedAt {
    year
    month
    day
  }
  notes
}

fragment MangaBase on Media {
  title {
    userPreferred
    english
    romaji
    native
  }
  coverImage {
    extraLarge
    large
    medium
    color
  }
  genres
  status
  chapters
}

fragment MangaMedia on Media {
  ...MangaBase
  mediaListEntry {
    id
    progress
  }
}

fragment MangaDetail on Media {
  ...MangaBase
  description
  bannerImage
  averageScore
  startDate {
    year
  }
  mediaListEntry {
    id
    ...MangaTracking @nonreactive
  }
  staff(perPage: 6, sort: RELEVANCE) {
    edges {
      role
      node {
        id
        name {
          full
        }
      }
    }
  }
}
