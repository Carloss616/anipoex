fragment MangaListEntry on MediaList {
  status
  progress
  score
  startedAt {
    year
    month
    day
  }
  completedAt {
    year
    month
    day
  }
  notes
}

fragment MangaMedia on Media {
  title {
    userPreferred
    english
    romaji
    native
  }
  coverImage {
    large
    medium
    color
  }
  startDate {
    year
  }
  genres
  chapters
  mediaListEntry {
    id
    ...MangaListEntry
  }
}
