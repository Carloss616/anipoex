apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.extensionruntime'
version = '1.0.0'

android {
  namespace "expo.modules.extensionruntime"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    consumerProguardFiles 'proguard-rules.pro'
  }
}

// Host side of Mihon's extensions-lib 1.4/1.6 (eu.kanade.tachiyomi.*, adapted from Mihon, Apache-2.0, see NOTICE): covers what those extensions commonly call; rateLimit/rateLimitHost, JavaScriptEngine (QuickJS) and HttpSource.fetchImage are not provided yet, so an extension fails when it reaches them.
// Versions follow the extensions-lib build, capped where a newer one needs a Kotlin compiler past the app's 2.2.
dependencies {
  // The BOM lifts React Native's OkHttp 4 (and okhttp-urlconnection) to the 5.x extensions call into.
  implementation platform('com.squareup.okhttp3:okhttp-bom:5.4.0')
  implementation 'com.squareup.okhttp3:okhttp'
  implementation 'com.squareup.okhttp3:okhttp-brotli'
  implementation 'com.squareup.okhttp3:okhttp-zstd'
  implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps'
  implementation 'org.jsoup:jsoup:1.22.2'
  implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.10.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json-okio:1.10.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-serialization-protobuf:1.10.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
  implementation 'uy.kohesive.injekt:injekt-core:1.16.1'
  implementation 'androidx.preference:preference:1.2.1'
  // extensions-lib 1.4's Observable API.
  implementation 'io.reactivex:rxjava:1.3.8'
}
