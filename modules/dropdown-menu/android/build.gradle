buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'expo.modules.dropdownmenu'
version = '1.0.0'

android {
  namespace "expo.modules.dropdownmenu"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  buildFeatures {
    compose true
  }
}

// Versions follow @expo/ui's own build.gradle: the composable runs inside its Host.
dependencies {
  // @expo/ui ships prebuilt (local-maven-repo), not as a :expo-ui project, and
  // autolinking serves that repo for the installed version only.
  def expoUi = new groovy.json.JsonSlurper().parse(file("../../../node_modules/@expo/ui/package.json"))
  compileOnly "expo.modules.ui:expo.modules.ui:${expoUi.version}"
  // ModifierList is built on React Native's Dynamic.
  implementation 'com.facebook.react:react-android'
  implementation 'androidx.compose.foundation:foundation-android:1.12.1'
  implementation 'androidx.compose.ui:ui-android:1.12.1'
  implementation 'androidx.compose.material3:material3-android:1.5.0-beta01'
  // Check for the selected row; @expo/ui ships no icon set.
  implementation 'androidx.compose.material:material-icons-core:1.7.8'
}
