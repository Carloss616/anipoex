# Builds the apps for a release published with `gh release create vX.Y.Z` and
# uploads them to it. To rebuild a tag's assets, run it on that tag:
# `gh workflow run release.yml --ref vX.Y.Z`.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.ref_name }}

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - run: bun install --frozen-lockfile
      - name: Write .env.local
        run: printf '%s\n' "$ENV_LOCAL" > .env.local
        env:
          ENV_LOCAL: ${{ secrets.ENV_LOCAL }}
      - run: bunx expo prebuild --platform android --no-install

      - name: Write keystore.properties
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEYSTORE_PASSWORD" > keystore.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      - run: scripts/apk/build.sh
      - name: Upload
        run: |
          apk="anipoex-$RELEASE_TAG.apk"
          mv build/apk/anipoex.apk "$apk"
          gh release upload "$RELEASE_TAG" "$apk" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  # An IPA for SideStore and AltStore, which sign it on the device: no Apple
  # account here.
  ios:
    # shortcut: Xcode 27 is only on this preview image, so builds can queue;
    # move to the GA macOS image once it ships Xcode 27.
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false
      # The extension runtime's jars build with Gradle.
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - run: bun install --frozen-lockfile
      - name: Write .env.local
        run: printf '%s\n' "$ENV_LOCAL" > .env.local
        env:
          ENV_LOCAL: ${{ secrets.ENV_LOCAL }}
      # Android too: the runtime script builds the jars with android/gradlew.
      - run: bunx expo prebuild --no-install
      - run: bun run extensions:ios-runtime
      - run: pod install
        working-directory: ios

      - run: scripts/ipa/build.sh

      # source.json is what users add to SideStore or AltStore, always from
      # releases/latest/download/source.json.
      - name: Write the SideStore source and upload
        run: |
          ipa="anipoex-$RELEASE_TAG.ipa"
          mv build/ipa/anipoex.ipa "$ipa"
          gh release view "$RELEASE_TAG" --json tagName,body,publishedAt > "$RUNNER_TEMP/release.json"
          bun scripts/ipa/source.ts build/ipa/Build/Products/Release-iphoneos/anipoex.app \
            "$ipa" "$RUNNER_TEMP/release.json" > source.json
          gh release upload "$RELEASE_TAG" "$ipa" source.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
